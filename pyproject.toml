[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor_sono"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "librosa>=0.10",
    "streamlit>=1.35",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

# IMPORTANTE: instale sempre com "pip install -e ." (modo editável).
# O config.py calcula dados/ a partir do local do arquivo em src/;
# uma instalação normal copiaria o pacote para site-packages e
# quebraria o caminho relativo para a pasta de gravações e banco.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
